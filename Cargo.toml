[package]
name = "ncount"
version = "0.7.7"
edition = "2024"
authors = ["J/A <archer884@gmail.com>"]
license = "Unlicense"
keywords = ["novel", "word-count", "text"]
readme = "readme.md"
homepage = "https://github.com/archer884/ncount"
repository = "https://github.com/archer884/ncount"
categories = ["command-line-utilities", "text-processing"]
description = "A word count tool that derives useful stats from Markdown, ignoring HTML comments and footnotes"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "wrap_help", "color"] }
compact_str = "0.10.0"
crossterm = "0.29.0"
either = "1.17.0"
gix = { version = "0.90.0", default-features = false, features = ["sha1"], optional = true }
globset = { version = "0.4.20", optional = true }
globwalk = "0.9.1"
jiff = { version = "0.2.38", optional = true }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
owo-colors = "4.3.0"
prettytable-rs = "0.10.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"

[features]
# `ncount -p`: chart words per day from the manuscript's git history.
progress = ["dep:gix", "dep:jiff", "dep:globset"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0
# debug = true # used for flamegraph generation
